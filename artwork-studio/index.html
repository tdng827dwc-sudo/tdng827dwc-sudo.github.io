<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profabrix AI Artwork Studio v3.8</title><style>html,body{margin:0;background:#070b12;color:#fff;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.box{max-width:520px}.spinner{width:44px;height:44px;border:3px solid #273244;border-top-color:#ff4ea3;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#98a5b5}</style></head><body><div id="loading"><div class="box"><div class="spinner"></div><b>Loading Profabrix AI Artwork Studio v3.8…</b><br><small>EASY Mode + Print Guide</small></div></div><script>(async()=>{try{const files=['v38-part1.txt','v38-part2.txt','v38-part3.txt','v38-part4.txt'];const b64=(await Promise.all(files.map(f=>fetch(f+'?v=38').then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()})))).join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close();}catch(e){document.getElementById('loading').innerHTML='<div class="box"><b>Unable to load Studio.</b><br><small>'+e+'</small></div>';}})();</script></body></html>
