<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Profabrix AI Artwork Studio</title>
<style>
html,body{margin:0;min-height:100%;background:#080b10;color:#f6f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
#boot b{font-size:14px;letter-spacing:.08em}#boot small{display:block;margin-top:8px;color:#9ca7b8}
</style>
</head>
<body>
<div id="boot"><div><b>PROFABRIX AI ARTWORK STUDIO</b><small>Loading canonical style previews…</small></div></div>
<script>
(async function(){
  try{
    const r=await fetch("./core-v393.html?v=canonical-2",{cache:"no-cache"});
    if(!r.ok) throw new Error("core "+r.status);
    let html=await r.text();
    const inject='<script src="./canonical-thumbnails.js?v=canonical-2"><\/script>';
    if(!html.includes("</body>")) throw new Error("invalid core");
    html=html.replace("</body>",inject+"</body>");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const boot=document.getElementById("boot");
    if(boot) boot.innerHTML="<div><b>Studio could not load.</b><small>Refresh the page and try again.</small></div>";
    console.error("Profabrix boot error",err);
  }
})();
</script>
</body>
</html>
